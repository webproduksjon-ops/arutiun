<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Страница не найдена | Панчоян Арутюн</title>
  <style>
    @font-face { font-family: "Gilroy"; src: url(assets/fonts/Gilroy-Regular.ttf); font-weight: 400; }
    @font-face { font-family: "Gilroy"; src: url(assets/fonts/Gilroy-Medium.ttf); font-weight: 500; }
    @font-face { font-family: "Gilroy"; src: url(assets/fonts/Gilroy-SemiBold.ttf); font-weight: 600; }

    :root {
      --green: #00130c;
      --green1: #00422a;
      --green2: #00d084;
      --white: #f5f5f5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--green);
      font-family: "Gilroy", sans-serif;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .bg-number {
      position: absolute;
      font-size: 40vw;
      font-weight: 600;
      color: var(--green1);
      opacity: 0.4;
      user-select: none;
      z-index: 0;
      line-height: 1;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      color: #a0bba8;
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 40px;
    }

    .btn {
      display: inline-block;
      padding: 14px 40px;
      background: var(--green2);
      color: var(--green);
      font-family: "Gilroy", sans-serif;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      border-top-left-radius: 12px;
      border-bottom-right-radius: 12px;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    .tag {
      display: inline-block;
      background: var(--green1);
      color: var(--green2);
      font-size: 13px;
      font-style: italic;
      padding: 6px 16px;
      border-radius: 4px;
      margin-bottom: 24px;
    }

    @media (max-width: 480px) {
      .bg-number { font-size: 55vw; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="bg-number">404</div>

  <div class="content">
    <div class="tag">Страница не найдена</div>
    <h1>Кажется, вы немного заблудились</h1>
    <p>Страница, которую вы ищете, не существует или была перемещена. Но это не повод для стресса — давайте вернёмся на главную.</p>
    <a href="index.html" class="btn">Вернуться на главную</a>
  </div>

</body>
</html>
